version: "3.9"

services:
  web:
    container_name: gou-web
    image: gou-web:latest
    restart: always
    ports:
      - 8080:4321
    env_file: ./web/.env

  cms:
    container_name: gou-cms
    image: gou-cms:latest
    restart: always
    ports:
      - 3000:3000
    env_file: ./cms/.env

  db:
    container_name: gou-db
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    volumes:
      - /docker/db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: gou_db
      POSTGRES_USER: thomas
      POSTGRES_PASSWORD: test

  portainer:
    container_name: gou-portainer
    image: portainer/portainer-ce
    ports:
      - 9000:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always

volumes:
  db_data:
  portainer_data:
